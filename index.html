<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Buscador de Tina</title>

    <!-- Fuente Open Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;700&display=swap"
      rel="stylesheet"
    />

    <!-- Archivo de estilos CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Cabecera -->
    <header class="cabecera">
      <h1>Buscador de Tina</h1>

      <nav>
        <a href="#">Inicio</a>
        <a href="#">Imágenes</a>
        <a href="#">Ayuda</a>
      </nav>
    </header>

    <!-- Zona principal -->
    <main id="principal">
      <section class="busqueda">
        <h2>¿Qué quieres buscar?</h2>

        <p class="mensaje">Encuentra lo que necesitas de una forma sencilla.</p>

        <form>
          <input
            type="text"
            id="campo-busqueda"
            placeholder="Escribe tu búsqueda..."
          />

          <div class="botones">
            <button type="submit" class="boton">Buscar</button>

            <button type="button" class="boton boton-secundario">
              🍀 Voy a tener suerte
            </button>
          </div>
        </form>
      </section>
    </main>

    <!-- Pie de página -->
    <footer class="pie">
      <p>© 2026 Buscador de Tina</p>

      <div>
        <a href="#">Privacidad</a>
        <a href="#">Condiciones</a>
      </div>
    </footer>
  </body>
</html>
